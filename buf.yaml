version: v2
modules:
  - path: proto
lint:
  use:
    # STANDARD is Buf v2's name for the v1 DEFAULT rule set.
    - STANDARD
    # The public surface must be commented: every RPC, message, and field.
    - COMMENT_RPC
    - COMMENT_MESSAGE
    - COMMENT_FIELD
  ignore:
    # This compatibility shim intentionally keeps Buf's canonical package name.
    - proto/buf/validate
  ignore_only:
    # The vendored contract proto is rendered from the sanitized descriptor,
    # which is required to omit source comments; its comment coverage is
    # reviewed in the upstream contract export instead.
    COMMENT_RPC:
      - proto/medallion/connect/v1/connect.proto
    COMMENT_MESSAGE:
      - proto/medallion/connect/v1/connect.proto
    COMMENT_FIELD:
      - proto/medallion/connect/v1/connect.proto
breaking:
  use:
    - FILE
