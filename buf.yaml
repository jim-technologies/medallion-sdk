version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # The bounded public Storage contract preserves canonical RPC names and
    # request/response reuse so its wire surface cannot drift from the service.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
  ignore:
    # This compatibility shim intentionally keeps Buf's canonical package name.
    - proto/buf/validate
breaking:
  use:
    - FILE
