[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "medallion"
version = "0.4.0"
description = "Server-side Python SDK for getting data into and out of Medallion: tables, batch appends, and SQL queries."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Jim Technologies" }
]
keywords = ["medallion", "tables", "ingestion", "clickhouse", "arrow", "cdc", "audit", "sdk"]
classifiers = [
  "Private :: Do Not Upload",
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = [
  "bufbuild-protovalidate-protocolbuffers-python @ https://buf.build/gen/python/bufbuild-protovalidate-protocolbuffers-python/bufbuild_protovalidate_protocolbuffers_python-36.2.0.1.20260825204119+511051f7f437-py3-none-any.whl#sha256=1fc540461329e0768d897fb7641d7bd42eaf6a0409caed93ba8b968e07f89551",
  "bufbuild-protovalidate-protocolbuffers-pyi @ https://buf.build/gen/python/bufbuild-protovalidate-protocolbuffers-pyi/bufbuild_protovalidate_protocolbuffers_pyi-36.2.0.1.20260825204119+511051f7f437-py3-none-any.whl#sha256=4bce3808f220e4476cc6b2b82bcbd55aae608161837576aacb6e48c13a0cfcd6",
  "opentelemetry-api>=1.44.0,<2",
  "protobuf>=7.36.2,<8",
]

[project.optional-dependencies]
# Dataframe conveniences for the tables surface: polars append inputs,
# query results collected with to_polars(), and Arrow IPC payloads.
polars = [
  "polars>=2.0.0,<3",
  "pyarrow>=19,<26",
]
# Durable execution: the workflows factory hands back Temporaless's own
# ConnectStore/ConnectQueryStore, so it needs that exact release. The pin is
# an immutable commit; scripts/check_versions.py holds it to the version and
# commit recorded in medallion.workflows, and the compat test fails when the
# installed contract drifts from what this SDK wraps.
workflows = [
  "temporaless @ git+https://github.com/jim-technologies/temporaless.git@136fdf5b5fb5ec9fc30f1e58b3fd42445b123201#subdirectory=core/py",
]

[dependency-groups]
# The dataframe conveniences are exercised by the unit tests, so the dev
# environment installs the same optional stack consumers get from
# medallion[polars].
dev = [
  "medallion[workflows]",
  "polars>=2.0.0,<3",
  "pyarrow>=19,<26",
]

[project.urls]
Homepage = "https://github.com/jim-technologies/medallion-sdk"
Repository = "https://github.com/jim-technologies/medallion-sdk"
Issues = "https://github.com/jim-technologies/medallion-sdk/issues"

[tool.hatch.metadata]
# Temporaless uses an immutable Git commit; the shared Buf generated modules
# use hashed official wheel URLs so consumers need no extra package index.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/medallion"]

[tool.hatch.build.targets.sdist]
exclude = ["/tests", "/uv.lock"]

[tool.ruff]
target-version = "py314"
extend-exclude = [
  "src/medallion/connect/v1/connect_pb2.py",
  "src/medallion/ingest/v1/ingest_pb2.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Protobuf runtime aliases deliberately remain normal assignments rather than
# PEP 695 TypeAliasType objects.
"src/medallion/types.py" = ["UP040"]
