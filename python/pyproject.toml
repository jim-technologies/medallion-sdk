[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "medallion"
version = "0.2.0"
description = "Server-side Python SDK for Medallion CDC and audit ingestion."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Jim Technologies" }
]
keywords = ["medallion", "cdc", "audit", "ingestion", "sdk"]
classifiers = [
  "Private :: Do Not Upload",
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = [
  "opentelemetry-api>=1.44.0,<2",
  "protobuf>=7.35.1,<8",
]

[project.urls]
Homepage = "https://github.com/jim-technologies/medallion-sdk"
Repository = "https://github.com/jim-technologies/medallion-sdk"
Issues = "https://github.com/jim-technologies/medallion-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/medallion", "src/buf"]

[tool.hatch.build.targets.sdist]
exclude = ["/tests", "/uv.lock"]

[tool.ruff]
target-version = "py314"
extend-exclude = [
  "src/buf/validate/validate_pb2.py",
  "src/medallion/connect/v1/connect_pb2.py",
  "src/medallion/ingest/v1/ingest_pb2.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Protobuf runtime aliases deliberately remain normal assignments rather than
# PEP 695 TypeAliasType objects.
"src/medallion/types.py" = ["UP040"]
