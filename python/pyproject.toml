[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "medallion"
version = "0.1.1"
description = "Public Python SDK for Medallion."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Jim Technologies" }
]
keywords = ["medallion", "audit", "sdk"]
classifiers = [
  "Private :: Do Not Upload",
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = [
  "opentelemetry-api>=1.44.0",
  "protobuf>=7.35.1",
]

[project.urls]
Homepage = "https://github.com/jim-technologies/medallion-sdk"
Repository = "https://github.com/jim-technologies/medallion-sdk"
Issues = "https://github.com/jim-technologies/medallion-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/medallion", "src/buf"]

[tool.ruff]
target-version = "py314"
extend-exclude = [
  "src/buf/validate/validate_pb2.py",
  "src/medallion/connect/v1/connect_pb2.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# These exports deliberately remain runtime class aliases, not PEP 695
# TypeAliasType objects, so existing `medallion.Connector(...)` calls keep
# working.
"src/medallion/types.py" = ["UP040"]
