packages:
  - "."

overrides:
  esbuild: "0.28.2"
  postcss: "8.5.31"
  source-map-js: "1.2.2"

# invariantprotocol is Git-distributed and builds its TypeScript output during
# installation. Keep this exact commit allowlisted with the dependency pin.
allowBuilds:
  "@jim-technologies/invariant-protocol@https://codeload.github.com/jim-technologies/invariantprotocol/tar.gz/79ead8726b4d79ee7c024b85441daf6f46851830": true
  "esbuild": true
  "protobufjs": false

# Install only releases at least a day old, frozen installs included. Refuse a
# version published with weaker trust evidence than an earlier release, and
# Git or tarball sources that only a transitive dependency names
# (invariantprotocol is a direct dependency, so it stays allowed).
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
blockExoticSubdeps: true
