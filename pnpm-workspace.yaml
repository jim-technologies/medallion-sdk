packages:
  - "."

overrides:
  esbuild: "0.28.1"
  postcss: "8.5.24"

# invariantprotocol is Git-distributed and builds its TypeScript output during
# installation. Keep this exact commit allowlisted with the dependency pin.
allowBuilds:
  "@jim-technologies/invariant-protocol@https://codeload.github.com/jim-technologies/invariantprotocol/tar.gz/f924e602582402476f257571852fabb0e1e1cf43": true
  "esbuild": true
  "protobufjs": false

# Permit the patched PostCSS release through pnpm's minimum-release-age gate.
minimumReleaseAgeExclude:
  - postcss@8.5.24
