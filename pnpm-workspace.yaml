packages:
  - "."

overrides:
  esbuild: "0.28.2"
  postcss: "8.5.26"

# invariantprotocol is Git-distributed and builds its TypeScript output during
# installation. Keep this exact commit allowlisted with the dependency pin.
allowBuilds:
  "@jim-technologies/invariant-protocol@https://codeload.github.com/jim-technologies/invariantprotocol/tar.gz/535d6ca5cf41f6e1029da0946a754e6724a5cf69": true
  "esbuild": true
  "protobufjs": false

# Permit the patched PostCSS release through pnpm's minimum-release-age gate.
minimumReleaseAgeExclude:
  - postcss@8.5.26
