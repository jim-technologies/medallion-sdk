packages:
  - "."

overrides:
  esbuild: "0.28.1"

# invariantprotocol is Git-distributed and builds its TypeScript output during
# installation. Keep this exact commit allowlisted with the dependency pin.
allowBuilds:
  "@bufbuild/buf": true
  "@jim-technologies/invariant-protocol@https://codeload.github.com/jim-technologies/invariantprotocol/tar.gz/e1fb753ae72b0eb33f9de00fe319a1a2ab55dffd": true
  "esbuild": true
  "protobufjs": false
