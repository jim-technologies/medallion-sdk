syntax = "proto3";

package medallion.ontology.v1;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jim-technologies/medallion-sdk/go/gen/medallion/ontology/v1;ontologyv1";

// MedallionOntologyService owns tenant-aware ontology catalog/control-plane
// state. Protobuf is the canonical API and model contract; HTTP routes are
// projections or aliases of these messages.
service MedallionOntologyService {
  // RunDiscovery discovers datasource and connector metadata for a tenant.
  rpc RunDiscovery(RunDiscoveryRequest) returns (RunDiscoveryResponse);
  // ListDataSources returns tenant-scoped registered datasources.
  rpc ListDataSources(ListDataSourcesRequest) returns (ListDataSourcesResponse);
  // GetOntologyGraph returns a bounded page of the tenant ontology graph.
  rpc GetOntologyGraph(GetOntologyGraphRequest) returns (GetOntologyGraphResponse);
  // ListOntologyEntities returns a bounded page of tenant ontology entities.
  rpc ListOntologyEntities(ListOntologyEntitiesRequest) returns (ListOntologyEntitiesResponse);
  // ListActions returns explicit deterministic action definitions.
  rpc ListActions(ListActionsRequest) returns (ListActionsResponse);
  // Query answers tenant-scoped audit or business questions from stored evidence.
  rpc Query(QueryRequest) returns (QueryResponse);
  // PlanAction validates and persists a deterministic action plan.
  rpc PlanAction(PlanActionRequest) returns (PlanActionResponse);
  // ExecuteAction authorizes, validates, executes, and audits an explicit action.
  rpc ExecuteAction(ExecuteActionRequest) returns (ExecuteActionResponse);
  // ListAuditEvents returns audit evidence for a tenant-scoped resource.
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);
  // GetProjectionFreshness returns freshness and retry state for data
  // projections such as medallion-connect audit imports.
  rpc GetProjectionFreshness(GetProjectionFreshnessRequest) returns (GetProjectionFreshnessResponse);
  // RefreshAuditProjection imports a bounded, tenant-scoped audit event window.
  rpc RefreshAuditProjection(RefreshAuditProjectionRequest) returns (RefreshAuditProjectionResponse);
}

enum LifecycleStatus {
  // Default value; callers should not persist this state.
  LIFECYCLE_STATUS_UNSPECIFIED = 0;
  // Resource is active and usable.
  LIFECYCLE_STATUS_ACTIVE = 1;
  // Resource is disabled but retained.
  LIFECYCLE_STATUS_DISABLED = 2;
  // Resource has been soft-deleted.
  LIFECYCLE_STATUS_DELETED = 3;
}

// MappingConfidence labels whether ontology edges come from AI inference,
// deterministic discovery, or human promotion.
enum MappingConfidence {
  // Default value when no confidence has been assigned.
  MAPPING_CONFIDENCE_UNSPECIFIED = 0;
  // Weak inferred mapping; should be shown with low trust.
  MAPPING_CONFIDENCE_LOW = 1;
  // Moderate inferred mapping; usable for reads with labels.
  MAPPING_CONFIDENCE_MEDIUM = 2;
  // Strong inferred mapping; still not enough for writes.
  MAPPING_CONFIDENCE_HIGH = 3;
  // Human-approved mapping; allowed for write/action guardrails.
  MAPPING_CONFIDENCE_PROMOTED = 4;
}

// DiscoveryRunStatus tracks datasource discovery lifecycle.
enum DiscoveryRunStatus {
  // Default value; callers should not persist this state.
  DISCOVERY_RUN_STATUS_UNSPECIFIED = 0;
  // Run is accepted but not yet started.
  DISCOVERY_RUN_STATUS_QUEUED = 1;
  // Run is currently executing.
  DISCOVERY_RUN_STATUS_RUNNING = 2;
  // Run completed successfully.
  DISCOVERY_RUN_STATUS_SUCCEEDED = 3;
  // Run failed.
  DISCOVERY_RUN_STATUS_FAILED = 4;
}

// ActionInvocationStatus tracks deterministic action planning/execution state.
enum ActionInvocationStatus {
  // Default value; callers should not persist this state.
  ACTION_INVOCATION_STATUS_UNSPECIFIED = 0;
  // Invocation is a plan only; no external write occurred.
  ACTION_INVOCATION_STATUS_PLANNED = 1;
  // Invocation is executing.
  ACTION_INVOCATION_STATUS_RUNNING = 2;
  // Invocation completed successfully.
  ACTION_INVOCATION_STATUS_SUCCEEDED = 3;
  // Invocation failed after being accepted.
  ACTION_INVOCATION_STATUS_FAILED = 4;
  // Invocation was rejected by authorization or validation guardrails.
  ACTION_INVOCATION_STATUS_REJECTED = 5;
}

// Tenant is a Medallion organization boundary used for all ontology state.
message Tenant {
  // Stable tenant/organization id.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // Human-readable tenant slug.
  string slug = 2;
  // Human-readable tenant display name.
  string display_name = 3;
  // Tenant lifecycle status.
  LifecycleStatus status = 4;
}

// Subject is an authenticated stable principal within a tenant.
message Subject {
  // Stable principal such as user:google:<sub> or service_account:sa_<ulid>.
  string principal = 1 [(buf.validate.field).string.min_len = 1];
  // Tenant the subject is acting within.
  string tenant_id = 2 [(buf.validate.field).string.min_len = 1];
}

// DataSource is a registered connected system or source namespace.
message DataSource {
  // Stable ontology datasource id.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // Tenant that owns this datasource.
  string tenant_id = 2 [(buf.validate.field).string.min_len = 1];
  // Connector kind such as postgres, github_mcp, google_analytics, vercel, or
  // medallion_audit_logs.
  string connector_kind = 3 [(buf.validate.field).string.min_len = 1];
  // Source system namespace.
  string source_system = 4 [(buf.validate.field).string.min_len = 1];
  // Human-readable datasource display name.
  string display_name = 5 [(buf.validate.field).string.min_len = 1];
  // Stable id from the source system or medallion-connect connector.
  string external_id = 6;
  // Datasource lifecycle status.
  LifecycleStatus status = 7;
  // Creation timestamp.
  google.protobuf.Timestamp created_at = 8;
  // Last update timestamp.
  google.protobuf.Timestamp updated_at = 9;
  // Raw source metadata discovered from the connector.
  google.protobuf.Struct raw_metadata = 10;
}

// Connector is the medallion-connect runtime component for a datasource.
message Connector {
  // Stable connector id.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // Tenant that owns this connector.
  string tenant_id = 2 [(buf.validate.field).string.min_len = 1];
  // Datasource this connector populates.
  string datasource_id = 3 [(buf.validate.field).string.min_len = 1];
  // Connector kind.
  string kind = 4 [(buf.validate.field).string.min_len = 1];
  // Connector implementation version.
  string version = 5;
  // Connector lifecycle status.
  LifecycleStatus status = 6;
}

// Dataset is a discovered source table, stream, collection, or view.
message Dataset {
  // Stable dataset id.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // Tenant that owns this dataset.
  string tenant_id = 2 [(buf.validate.field).string.min_len = 1];
  // Datasource this dataset came from.
  string datasource_id = 3 [(buf.validate.field).string.min_len = 1];
  // Dataset/table/view/collection name.
  string name = 4 [(buf.validate.field).string.min_len = 1];
  // Stable external reference.
  string external_ref = 5;
}

// Attribute describes a known or inferred entity attribute.
message Attribute {
  // Attribute name.
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // Attribute scalar/logical kind.
  string value_kind = 2;
  // Source reference for provenance.
  string source_ref = 3;
  // Confidence for inferred or promoted attributes.
  MappingConfidence confidence = 4;
}

// EntityType defines a tenant-scoped semantic object type.
message EntityType {
  // Stable entity type id.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // Tenant that owns this entity type.
  string tenant_id = 2 [(buf.validate.field).string.min_len = 1];
  // Entity type name.
  string name = 3 [(buf.validate.field).string.min_len = 1];
  // Known attributes for this entity type.
  repeated Attribute attributes = 4;
}

// Entity is a tenant-scoped semantic object instance.
message Entity {
  // Stable entity id.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // Tenant that owns this entity.
  string tenant_id = 2 [(buf.validate.field).string.min_len = 1];
  // Entity type id.
  string entity_type_id = 3 [(buf.validate.field).string.min_len = 1];
  // Datasource id, when the entity is source-backed.
  string datasource_id = 4;
  // Source-system reference.
  string source_ref = 5;
  // Entity attributes.
  google.protobuf.Struct attributes = 6;
  // Mapping confidence label.
  MappingConfidence confidence = 7;
  // Last update timestamp for pagination.
  google.protobuf.Timestamp updated_at = 8;
}

// RelationshipType defines a typed edge between semantic entity types.
message RelationshipType {
  // Stable relationship type id.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // Tenant that owns this relationship type.
  string tenant_id = 2 [(buf.validate.field).string.min_len = 1];
  // Relationship type name.
  string name = 3 [(buf.validate.field).string.min_len = 1];
  // Optional from entity type id.
  string from_entity_type_id = 4;
  // Optional to entity type id.
  string to_entity_type_id = 5;
}

// Relationship is a typed edge between semantic entities.
message Relationship {
  // Stable relationship id.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // Tenant that owns this relationship.
  string tenant_id = 2 [(buf.validate.field).string.min_len = 1];
  // Relationship type id.
  string relationship_type_id = 3 [(buf.validate.field).string.min_len = 1];
  // Source entity id.
  string from_entity_id = 4 [(buf.validate.field).string.min_len = 1];
  // Target entity id.
  string to_entity_id = 5 [(buf.validate.field).string.min_len = 1];
  // Relationship attributes.
  google.protobuf.Struct attributes = 6;
  // Mapping confidence label.
  MappingConfidence confidence = 7;
  // Last update timestamp for pagination.
  google.protobuf.Timestamp updated_at = 8;
}

// OntologyGraph is a bounded page of entity and relationship graph data.
message OntologyGraph {
  // Tenant scope of this graph page.
  string tenant_id = 1 [(buf.validate.field).string.min_len = 1];
  // Entity types in this graph page.
  repeated EntityType entity_types = 2;
  // Entities in this graph page.
  repeated Entity entities = 3;
  // Relationship types in this graph page.
  repeated RelationshipType relationship_types = 4;
  // Relationships in this graph page.
  repeated Relationship relationships = 5;
}

// MappingCandidate is an inferred source-to-ontology mapping proposal.
message MappingCandidate {
  // Stable mapping candidate id.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // Tenant that owns this candidate.
  string tenant_id = 2 [(buf.validate.field).string.min_len = 1];
  // Datasource associated with the candidate.
  string datasource_id = 3;
  // Source reference being mapped.
  string source_ref = 4;
  // Ontology target reference.
  string target_ref = 5;
  // Inference confidence.
  MappingConfidence confidence = 6;
  // Human-readable rationale/provenance.
  string rationale = 7;
  // Creation timestamp.
  google.protobuf.Timestamp created_at = 8;
}

// PromotedMapping is a human-approved mapping usable for deterministic writes.
message PromotedMapping {
  // Stable promoted mapping id.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // Tenant that owns this promoted mapping.
  string tenant_id = 2 [(buf.validate.field).string.min_len = 1];
  // Candidate id that was promoted, when applicable.
  string candidate_id = 3;
  // Ontology target reference approved for deterministic writes.
  string target_ref = 4;
  // Stable principal that approved this mapping.
  string approved_by_principal = 5;
  // Approval timestamp.
  google.protobuf.Timestamp approved_at = 6;
}

// ActionDefinition is an explicit deterministic action contract.
message ActionDefinition {
  // Stable action name used in routes and authorization checks.
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // Tenant that owns this action definition, or empty for built-in definitions.
  string tenant_id = 2;
  // Human-readable display name.
  string display_name = 3;
  // Human-readable description.
  string description = 4;
  // JSON Schema for deterministic input validation.
  string input_schema_json = 5;
  // When true, execution input must reference a promoted mapping.
  bool requires_promoted_mapping = 6;
  // Whether the underlying action is idempotent.
  bool idempotency_supported = 7;
  // Action lifecycle status.
  LifecycleStatus status = 8;
  // Optional medallion-connect connector action id for execution delegation.
  string connector_action_id = 9;
  // Resource type this action operates on, used for audit.
  string resource_type = 10;
}

// ActionInvocation is a persisted plan or execution attempt.
message ActionInvocation {
  // Stable invocation id.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // Tenant that owns this invocation.
  string tenant_id = 2 [(buf.validate.field).string.min_len = 1];
  // Action name.
  string action_name = 3 [(buf.validate.field).string.min_len = 1];
  // Stable actor principal.
  string actor_principal = 4 [(buf.validate.field).string.min_len = 1];
  // Caller-provided idempotency key for execution.
  string idempotency_key = 5;
  // Action request payload.
  google.protobuf.Struct request = 6;
  // Action response payload.
  google.protobuf.Struct response = 7;
  // Invocation status.
  ActionInvocationStatus status = 8;
  // Deterministic explanation of the plan/execution result.
  string explanation = 9;
  // Error message when status is failed or rejected.
  string error_message = 10;
  // Creation timestamp.
  google.protobuf.Timestamp created_at = 11;
  // Target resource id, when known.
  string resource_id = 12;
}

// AuditEvent is tenant-scoped evidence for a source or ontology event.
message AuditEvent {
  // Stable audit event id.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // Tenant that owns this event.
  string tenant_id = 2 [(buf.validate.field).string.min_len = 1];
  // Stable actor principal.
  string actor_principal = 3;
  // Action verb such as cancel, approve, access, export, or execute.
  string action = 4 [(buf.validate.field).string.min_len = 1];
  // Target resource type.
  string target_type = 5 [(buf.validate.field).string.min_len = 1];
  // Target resource id.
  string target_id = 6 [(buf.validate.field).string.min_len = 1];
  // Request id that produced this event.
  string request_id = 7;
  // Additional metadata.
  google.protobuf.Struct metadata = 8;
  // Event timestamp.
  google.protobuf.Timestamp created_at = 9;
  // Before-state diff payload, when known.
  google.protobuf.Struct before = 10;
  // After-state diff payload, when known.
  google.protobuf.Struct after = 11;
  // Evidence/source link.
  string evidence_url = 12;
  // Source event id from the originating system.
  string source_event_id = 13;
}

// DiscoveryRun tracks a durable datasource discovery execution.
message DiscoveryRun {
  // Stable discovery run id.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // Tenant that owns this run.
  string tenant_id = 2 [(buf.validate.field).string.min_len = 1];
  // Run status.
  DiscoveryRunStatus status = 3;
  // Datasources included in this run.
  repeated string datasource_ids = 4;
  // Executor name or mode.
  string executor = 5;
  // Human-readable status message.
  string message = 6;
  // Run start timestamp.
  google.protobuf.Timestamp started_at = 7;
  // Run completion timestamp.
  google.protobuf.Timestamp completed_at = 8;
  // Number of discovered/updated datasource records.
  uint32 discovered_count = 9;
}

// ProjectionFreshness records a durable import/projection checkpoint.
message ProjectionFreshness {
  // Tenant that owns the projection.
  string tenant_id = 1 [(buf.validate.field).string.min_len = 1];
  // Datasource id associated with the projection.
  string datasource_id = 2;
  // Source connector id associated with the projection.
  string connector_id = 3;
  // Projection key, for example connect_audit_events.
  string projection = 4 [(buf.validate.field).string.min_len = 1];
  // Cursor to resume an incomplete paginated import.
  string cursor = 5;
  // Last successful complete projection time.
  google.protobuf.Timestamp last_success_at = 6;
  // Last attempted projection time.
  google.protobuf.Timestamp last_attempt_at = 7;
  // Last error message, when the previous attempt failed.
  string last_error = 8;
  // Last event id observed from the source.
  string last_source_event_id = 9;
  // Number of events imported in the latest attempt.
  uint32 imported_count = 10;
}

// RefreshAuditProjectionRequest selects a narrow audit import window.
message RefreshAuditProjectionRequest {
  // Tenant scope. REST routes overwrite this from authenticated identity.
  string tenant_id = 1 [(buf.validate.field).string.min_len = 1];
  // Optional resource id, for example order:123.
  string resource_id = 2;
  // Optional source actor principal filter.
  string actor_principal = 3;
  // Optional source action filter such as canceled, approved, or updated.
  string action = 4;
  // Optional connector ids to refresh.
  repeated string connector_ids = 5;
  // Page size per connector. The service caps large values.
  uint32 page_size = 6;
  // Maximum pages per connector. Defaults to one page for interactive use.
  uint32 max_pages = 7;
  // Ignore stored cursors and request the current source window.
  bool force = 8;
}

// RefreshAuditProjectionResponse returns imported count and freshness rows.
message RefreshAuditProjectionResponse {
  // Number of audit events imported in this refresh.
  uint32 imported_count = 1;
  // Freshness rows touched by this refresh.
  repeated ProjectionFreshness projections = 2;
}

// RunDiscoveryRequest starts a tenant-scoped discovery run.
message RunDiscoveryRequest {
  // Tenant scope. REST routes overwrite this from authenticated identity.
  string tenant_id = 1 [(buf.validate.field).string.min_len = 1];
  // Optional datasource ids to refresh.
  repeated string datasource_ids = 2;
  // Optional connector kinds to refresh.
  repeated string connector_kinds = 3;
  // Force refresh even if checkpoints appear current.
  bool force = 4;
}

// RunDiscoveryResponse returns the durable discovery run state.
message RunDiscoveryResponse {
  // Discovery run record.
  DiscoveryRun run = 1;
}

// ListDataSourcesRequest selects a datasource page for a tenant.
message ListDataSourcesRequest {
  // Tenant scope. REST routes overwrite this from authenticated identity.
  string tenant_id = 1 [(buf.validate.field).string.min_len = 1];
  // Opaque pagination cursor.
  string cursor = 2;
  // Page size. The service caps large values.
  uint32 page_size = 3;
}

// ListDataSourcesResponse contains a datasource page and next cursor.
message ListDataSourcesResponse {
  // Datasource page.
  repeated DataSource datasources = 1;
  // Opaque cursor for the next page.
  string next_cursor = 2;
}

// GetOntologyGraphRequest selects a bounded ontology graph page.
message GetOntologyGraphRequest {
  // Tenant scope. REST routes overwrite this from authenticated identity.
  string tenant_id = 1 [(buf.validate.field).string.min_len = 1];
  // Whether to include inferred, unpromoted mappings.
  bool include_inferred = 2;
  // Opaque pagination cursor.
  string cursor = 3;
  // Page size. The service caps large values to avoid giant graph payloads.
  uint32 page_size = 4;
}

// GetOntologyGraphResponse contains a bounded ontology graph page.
message GetOntologyGraphResponse {
  // Graph page.
  OntologyGraph graph = 1;
  // Opaque cursor for the next page.
  string next_cursor = 2;
}

// ListOntologyEntitiesRequest selects a bounded entity page.
message ListOntologyEntitiesRequest {
  // Tenant scope. REST routes overwrite this from authenticated identity.
  string tenant_id = 1 [(buf.validate.field).string.min_len = 1];
  // Optional entity type filter.
  string entity_type_id = 2;
  // Optional datasource filter.
  string datasource_id = 3;
  // Deprecated page size field retained for compatibility.
  uint32 limit = 4;
  // Opaque pagination cursor.
  string cursor = 5;
  // Page size. The service caps large values.
  uint32 page_size = 6;
}

// ListOntologyEntitiesResponse contains an entity page and next cursor.
message ListOntologyEntitiesResponse {
  // Entity page.
  repeated Entity entities = 1;
  // Opaque cursor for the next page.
  string next_cursor = 2;
}

// ListActionsRequest selects action definitions for a tenant.
message ListActionsRequest {
  // Tenant scope. REST routes overwrite this from authenticated identity.
  string tenant_id = 1 [(buf.validate.field).string.min_len = 1];
}

// ListActionsResponse contains explicit deterministic actions.
message ListActionsResponse {
  // Explicit action definitions available to this tenant.
  repeated ActionDefinition actions = 1;
}

// QueryRequest asks an audit or business question using stored evidence.
message QueryRequest {
  // Tenant scope. REST routes overwrite this from authenticated identity.
  string tenant_id = 1 [(buf.validate.field).string.min_len = 1];
  // Audit/business question.
  string question = 2 [(buf.validate.field).string.min_len = 1];
  // Whether reads may use inferred mappings with confidence labels.
  bool include_inferred = 3;
  // When true, attempt a narrow audit projection refresh before answering.
  bool refresh_projection = 4;
}

// QueryResponse contains the deterministic answer and evidence.
message QueryResponse {
  // Deterministic answer or summary.
  string answer = 1;
  // Resource ids used to answer the question.
  repeated string resource_ids = 2;
  // Explanations and provenance notes.
  repeated string explanations = 3;
  // Audit evidence used for the answer.
  repeated AuditEvent events = 4;
}

// PlanActionRequest validates a proposed action without executing it.
message PlanActionRequest {
  // Tenant scope. REST routes overwrite this from authenticated identity.
  string tenant_id = 1 [(buf.validate.field).string.min_len = 1];
  // Action name.
  string action_name = 2 [(buf.validate.field).string.min_len = 1];
  // Stable actor principal. REST routes overwrite this from authenticated identity.
  string actor_principal = 3 [(buf.validate.field).string.min_len = 1];
  // Action input payload.
  google.protobuf.Struct input = 4;
}

// PlanActionResponse contains the persisted action plan.
message PlanActionResponse {
  // Planned invocation record.
  ActionInvocation plan = 1;
  // Required approvals, if any.
  repeated string required_approvals = 2;
}

// ExecuteActionRequest executes an explicit action through deterministic code.
message ExecuteActionRequest {
  // Tenant scope. REST routes overwrite this from authenticated identity.
  string tenant_id = 1 [(buf.validate.field).string.min_len = 1];
  // Action name.
  string action_name = 2 [(buf.validate.field).string.min_len = 1];
  // Stable actor principal. REST routes overwrite this from authenticated identity.
  string actor_principal = 3 [(buf.validate.field).string.min_len = 1];
  // Caller-provided idempotency key.
  string idempotency_key = 4 [(buf.validate.field).string.min_len = 1];
  // Action input payload.
  google.protobuf.Struct input = 5;
}

// ExecuteActionResponse contains the persisted action invocation.
message ExecuteActionResponse {
  // Persisted invocation record.
  ActionInvocation invocation = 1;
}

// ListAuditEventsRequest selects audit evidence for a resource.
message ListAuditEventsRequest {
  // Tenant scope. REST routes overwrite this from authenticated identity.
  string tenant_id = 1 [(buf.validate.field).string.min_len = 1];
  // Resource id filter.
  string resource_id = 2 [(buf.validate.field).string.min_len = 1];
  // Deprecated page size field retained for compatibility.
  uint32 limit = 3;
  // Opaque pagination cursor.
  string cursor = 4;
  // Page size. The service caps large values.
  uint32 page_size = 5;
  // Optional actor principal filter.
  string actor_principal = 6;
}

// ListAuditEventsResponse contains audit evidence and next cursor.
message ListAuditEventsResponse {
  // Audit event page.
  repeated AuditEvent events = 1;
  // Opaque cursor for the next page.
  string next_cursor = 2;
}

// GetProjectionFreshnessRequest selects projection checkpoint rows.
message GetProjectionFreshnessRequest {
  // Tenant scope. REST routes overwrite this from authenticated identity.
  string tenant_id = 1 [(buf.validate.field).string.min_len = 1];
  // Optional datasource filter.
  string datasource_id = 2;
  // Optional connector filter.
  string connector_id = 3;
  // Optional projection filter.
  string projection = 4;
}

// GetProjectionFreshnessResponse contains projection freshness rows.
message GetProjectionFreshnessResponse {
  // Matching projection freshness rows.
  repeated ProjectionFreshness projections = 1;
}
