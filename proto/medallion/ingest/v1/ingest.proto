// medallion.ingest.v1 is the tabular ingestion and query surface: datasets,
// batch appends, and read-back queries. The shapes deliberately follow the
// widely understood BigQuery analogs (Append is the insertAll analog; Query
// and GetQueryResults are the synchronous-first jobs.query analog with
// poll-and-paginate), with job vocabulary removed.
//
// The workspace identity is carried only by the request headers
// (X-Medallion-API-Key or a bearer token, plus X-Medallion-Workspace-Id);
// no message in this package carries a workspace field. Batch-level replay
// protection uses the Idempotency-Key request header, never a body field.
//
// This vendored copy awaits its first sanitized upstream contract export and
// release attestation; until that pin lands, the upstream contract is
// authoritative and this file must track it exactly. See proto/README.md.
syntax = "proto3";

package medallion.ingest.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/jim-technologies/medallion-sdk/go/gen/medallion/ingest/v1;ingestv1";

// ResultFormat selects the encoding of query result rows.
enum ResultFormat {
  // Defaults to JSON rows.
  RESULT_FORMAT_UNSPECIFIED = 0;
  // Each result row is one JSON object rendered as text in rows_json.
  RESULT_FORMAT_JSON = 1;
  // Result rows are Arrow record batches in arrow_rows, encoded as one
  // Arrow IPC stream per page.
  RESULT_FORMAT_ARROW_IPC = 2;
}

// Row is one JSON row submitted to Append, the insertId+json analog.
message Row {
  // Optional caller-stable per-row deduplication identifier, passed through
  // to server-side best-effort row deduplication. At most 128 bytes.
  string insert_id = 1;
  // Exactly one JSON object rendered as text; keys are dataset column names.
  string json = 2;
}

// JsonRows carries the JSON row payload of one Append batch.
message JsonRows {
  // Rows in submission order. A batch contains 1 through 50,000 rows.
  repeated Row rows = 1;
}

// ArrowRecordBatch carries columnar rows as one serialized Arrow IPC stream,
// including its own embedded schema.
message ArrowRecordBatch {
  // A complete Arrow IPC stream (schema message plus record batches).
  bytes serialized_record_batch = 1;
}

// AppendRequest appends tabular rows to one dataset.
message AppendRequest {
  // Target dataset identifier, as returned by dataset creation.
  string dataset_id = 1;
  // Exactly one row payload encoding.
  oneof rows {
    // JSON object rows.
    JsonRows json_rows = 2;
    // Columnar rows as one Arrow IPC stream.
    ArrowRecordBatch arrow_rows = 3;
  }
}

// RowError reports one rejected row of an Append batch, the insertErrors
// analog flattened to a single reason per row.
message RowError {
  // Zero-based index of the rejected row in the submitted batch.
  uint32 index = 1;
  // Stable machine-readable rejection reason.
  string reason = 2;
  // Human-readable rejection description; never branch on this text.
  string message = 3;
}

// AppendResponse acknowledges one Append batch.
message AppendResponse {
  // Per-row rejections; empty when every submitted row was accepted.
  repeated RowError insert_errors = 1;
  // Number of rows durably accepted by this request.
  uint64 accepted_rows = 2;
  // True when the Idempotency-Key header matched an already accepted batch
  // and this response replays that prior acknowledgement.
  bool duplicate = 3;
}

// QueryRequest runs one read-only SQL statement, the jobs.query analog.
message QueryRequest {
  // One SQL statement in the declared ClickHouse SQL dialect, passed through
  // verbatim; the SDK never rewrites, parameterizes, or dialect-translates it.
  string query = 1;
  // Longest time the call may wait synchronously for completion before
  // returning completed=false with a query_id to poll. Zero selects the
  // server default.
  int64 timeout_ms = 2;
  // Validate the statement and report schema plus total_bytes_processed
  // without executing it or returning rows.
  bool dry_run = 3;
  // Largest number of rows in the first result page. Zero selects the
  // server default.
  uint32 max_results = 4;
  // Encoding of result rows.
  ResultFormat format = 5;
}

// ColumnSchema describes one result column.
message ColumnSchema {
  // Column name.
  string name = 1;
  // Declared ClickHouse type of the column, for example "UInt64" or
  // "Nullable(String)".
  string type = 2;
}

// ResultSchema describes the columns of a query result.
message ResultSchema {
  // Result columns in output order.
  repeated ColumnSchema columns = 1;
}

// QueryResults is one page of query state and rows shared by Query and
// GetQueryResults acknowledgements.
message QueryResults {
  // Identifier for polling and pagination; set whenever the query is still
  // running or more pages remain.
  string query_id = 1;
  // True when the query has finished and this page carries authoritative
  // results; false when the caller must poll GetQueryResults with query_id.
  bool completed = 2;
  // Result column schema; set once the query has completed and for dry runs.
  ResultSchema schema = 3;
  // Result rows for this page when the JSON format is selected; each entry
  // is exactly one JSON object rendered as text.
  repeated string rows_json = 4;
  // Result rows for this page when the Arrow IPC format is selected.
  ArrowRecordBatch arrow_rows = 5;
  // Opaque continuation token for the next page; empty on the last page.
  // Callers pass it back unchanged and never inspect or persist it.
  string next_page_token = 6;
  // Total rows in the complete result set, across every page.
  uint64 total_rows = 7;
  // Bytes the query processed, or would process for a dry run.
  int64 total_bytes_processed = 8;
}

// QueryResponse acknowledges Query.
message QueryResponse {
  // Query state and the first page of results.
  QueryResults results = 1;
}

// GetQueryResultsRequest polls a running query or fetches a further page,
// the getQueryResults analog.
message GetQueryResultsRequest {
  // Identifier returned by Query.
  string query_id = 1;
  // Continuation token from the previous page; empty for the first page.
  string page_token = 2;
  // Longest time the call may wait synchronously for completion before
  // returning completed=false again. Zero selects the server default.
  int64 timeout_ms = 3;
  // Largest number of rows in this result page. Zero selects the server
  // default.
  uint32 max_results = 4;
  // Encoding of result rows.
  ResultFormat format = 5;
}

// GetQueryResultsResponse acknowledges GetQueryResults.
message GetQueryResultsResponse {
  // Query state and one page of results.
  QueryResults results = 1;
}

// Dataset is one named tabular collection in the workspace selected by the
// request headers.
message Dataset {
  // Workspace-unique dataset identifier.
  string dataset_id = 1;
  // Human-readable description.
  string description = 2;
  // Server-assigned creation time.
  google.protobuf.Timestamp create_time = 3;
}

// CreateDatasetRequest creates one dataset.
message CreateDatasetRequest {
  // Workspace-unique dataset identifier chosen by the caller.
  string dataset_id = 1;
  // Optional human-readable description.
  string description = 2;
}

// CreateDatasetResponse acknowledges CreateDataset.
message CreateDatasetResponse {
  // The created dataset.
  Dataset dataset = 1;
}

// GetDatasetRequest reads one dataset.
message GetDatasetRequest {
  // Dataset identifier to read.
  string dataset_id = 1;
}

// GetDatasetResponse acknowledges GetDataset.
message GetDatasetResponse {
  // The requested dataset.
  Dataset dataset = 1;
}

// ListDatasetsRequest lists the datasets of the workspace selected by the
// request headers.
message ListDatasetsRequest {
  // Largest number of datasets in this page. Zero selects the server
  // default.
  uint32 page_size = 1;
  // Opaque continuation token from the previous page; empty for the first
  // page.
  string page_token = 2;
}

// ListDatasetsResponse acknowledges ListDatasets.
message ListDatasetsResponse {
  // One page of datasets.
  repeated Dataset datasets = 1;
  // Opaque continuation token for the next page; empty on the last page.
  string next_page_token = 2;
}

// MedallionIngestService is the tabular ingestion and query surface.
// Every RPC is unary JSON over the canonical
// /medallion.ingest.v1.MedallionIngestService/<Method> path.
service MedallionIngestService {
  // Append appends one batch of rows to a dataset; the insertAll analog.
  // The Idempotency-Key request header deduplicates whole-batch replays.
  rpc Append(AppendRequest) returns (AppendResponse);
  // Query runs one read-only SQL statement synchronously first; when the
  // synchronous budget elapses it returns completed=false and a query_id
  // to poll with GetQueryResults.
  rpc Query(QueryRequest) returns (QueryResponse);
  // GetQueryResults polls a running query and paginates its result rows.
  rpc GetQueryResults(GetQueryResultsRequest) returns (GetQueryResultsResponse);
  // CreateDataset creates one dataset in the selected workspace.
  rpc CreateDataset(CreateDatasetRequest) returns (CreateDatasetResponse);
  // GetDataset reads one dataset by identifier.
  rpc GetDataset(GetDatasetRequest) returns (GetDatasetResponse);
  // ListDatasets pages through the datasets of the selected workspace.
  rpc ListDatasets(ListDatasetsRequest) returns (ListDatasetsResponse);
}
