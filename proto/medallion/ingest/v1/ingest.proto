syntax = "proto3";

// Package medallion.ingest.v1 is the platform-owned tabular ingest and query
// lane: declare a table with a tabular schema, append rows (JSON or Arrow
// IPC), and query one logical table with declared ClickHouse SQL. The shapes
// deliberately follow BigQuery (insertAll / jobs.query) with Google AIP
// grammar; the dialect and auth are Medallion's own.
//
// This copy tracks the released platform contract exactly on the wire. It
// omits the upstream `buf.validate` field rules and `google.api.http`
// annotations, which this repository has no dependency on; every message,
// field name, field number, reserved range, and RPC is identical, and the
// omitted validation bounds are restated in the field comments so callers
// can still see them. See proto/README.md.
package medallion.ingest.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/jim-technologies/medallion-sdk/go/gen/medallion/ingest/v1;ingestv1";

// MedallionIngestService owns workspace-scoped tabular tables, row appends,
// and SQL queries over one logical table per table (ClickHouse hot tier
// unioned with the lake behind an arrival-time watermark). The verified
// workspace comes only from the authenticated transport; it appears in no
// message. Acknowledged appends are durable and immediately queryable.
// Future, deliberately unimplemented surface (reserved design room): a jobs
// resource for bulk staged loads, Storage-Write-style streams with a
// BUFFERED mode and FlushRows checkpoint, and large results via Arrow
// streams or presigned links.
service MedallionIngestService {
  // CreateTable declares a new table (one table with a declared schema,
  // a time column, and an optional sort key; the schema later evolves
  // additively via UpdateTable).
  rpc CreateTable(CreateTableRequest) returns (CreateTableResponse);
  // GetTable returns one table by resource name.
  rpc GetTable(GetTableRequest) returns (GetTableResponse);
  // ListTables returns the workspace's tables ordered by table id.
  rpc ListTables(ListTablesRequest) returns (ListTablesResponse);
  // UpdateTable evolves a table's schema (BigQuery tables.patch shape):
  // the request carries the FULL desired schema, and the only permitted
  // change is appending new nullable columns after the existing ones.
  // Existing columns (name, type, nullability, order), the time column, and
  // the sort key are immutable. Submitting the current schema unchanged is a
  // no-op success, so retries are safe.
  rpc UpdateTable(UpdateTableRequest) returns (UpdateTableResponse);
  // AppendRows appends a batch of rows to a table (BigQuery insertAll
  // shape). The acknowledgement guarantees the accepted rows are durable in
  // the journal and immediately visible to RunQuery. Batches are JSON rows or
  // one Arrow IPC stream; REST callers may also send a raw
  // application/vnd.apache.arrow.stream body and a Stripe-style
  // Idempotency-Key header (copied into request_id).
  rpc AppendRows(AppendRowsRequest) returns (AppendRowsResponse);
  // RunQuery executes one read-only ClickHouse SQL statement (BigQuery
  // jobs.query shape, modernized): sync-first, returning rows inline when the
  // query completes within timeout_ms, otherwise a RUNNING query to poll.
  rpc RunQuery(RunQueryRequest) returns (RunQueryResponse);
  // GetQueryResults polls a query and cursor-paginates its stored result set.
  rpc GetQueryResults(GetQueryResultsRequest) returns (GetQueryResultsResponse);
}

// ColumnSchema declares one column of a table.
message ColumnSchema {
  // Column name. Lowercase identifier matching "^[a-z][a-z0-9_]{0,63}$";
  // names beginning with an underscore are reserved for system columns such
  // as _ingest_time.
  string name = 1;
  // Column type, BigQuery-style: one of BOOL, INT64, FLOAT64, STRING, BYTES,
  // TIMESTAMP, DATE, or JSON.
  string type = 2;
  // Whether the column accepts null values.
  bool nullable = 3;
}

// TableSchema is the declared tabular schema of a table.
message TableSchema {
  // Ordered columns, 1 through 512 of them. Existing columns are immutable;
  // evolution via UpdateTable may only append new nullable columns at the
  // end.
  repeated ColumnSchema columns = 1;
}

// Table is one append-only logical table served across the hot tier and the
// lake. The resource name is workspace-relative because the workspace scope
// comes only from the verified transport identity.
message Table {
  // Resource name, "tables/{table}", matching
  // "^(tables/[a-z][a-z0-9_]{0,62})?$" within 128 bytes. Output only;
  // CreateTable takes the identifier in table_id.
  string name = 1;
  // Declared tabular schema. Required; evolves additively via UpdateTable.
  TableSchema schema = 2;
  // Name of the TIMESTAMP column that carries event time. Required, and
  // matching "^([a-z][a-z0-9_]{0,63})?$".
  string time_column = 3;
  // Optional sort key controlling physical order in both tiers, at most 8
  // column names; defaults to [time_column].
  repeated string sort_columns = 4;
  // Creation time. Output only.
  google.protobuf.Timestamp create_time = 5;
  // Reserved design room: expiration policy, partitioning override, stream
  // state, and labels.
  reserved 10 to 19;
}

// CreateTableRequest declares one table.
message CreateTableRequest {
  // Identifier for the new table, matching "^[a-z][a-z0-9_]{0,62}$"; becomes
  // name "tables/{table_id}".
  string table_id = 1;
  // The table to create. Required; name and create_time are ignored.
  Table table = 2;
  // Optional AIP-155 idempotency identifier for safe retries, at most 512
  // bytes.
  string request_id = 3;
}

// CreateTableResponse returns the created table.
message CreateTableResponse {
  // The created table with its resource name and creation time.
  Table table = 1;
}

// UpdateTableRequest evolves one table's schema additively.
message UpdateTableRequest {
  // The table carrying its resource name and the full desired schema.
  // Required. time_column and sort_columns must be empty or identical to the
  // current declaration; create_time is ignored.
  Table table = 1;
  // Optional AIP-155 idempotency identifier for safe retries, at most 512
  // bytes.
  string request_id = 2;
}

// UpdateTableResponse returns the evolved table.
message UpdateTableResponse {
  // The table with its full post-evolution schema.
  Table table = 1;
}

// GetTableRequest names one table.
message GetTableRequest {
  // Resource name, "tables/{table}", matching
  // "^tables/[a-z][a-z0-9_]{0,62}$".
  string name = 1;
}

// GetTableResponse returns one table.
message GetTableResponse {
  // The requested table.
  Table table = 1;
}

// ListTablesRequest pages through the workspace's tables.
message ListTablesRequest {
  // Maximum tables per page, 0 through 1000; the server may return fewer. 0
  // selects the server default.
  int32 page_size = 1;
  // Opaque continuation token from a previous response, at most 4096 bytes.
  string page_token = 2;
}

// ListTablesResponse is one page of tables.
message ListTablesResponse {
  // The tables on this page.
  repeated Table tables = 1;
  // Continuation token; empty when the listing is complete.
  string next_page_token = 2;
}

// Row is one JSON row, BigQuery insertAll-style.
message Row {
  // Optional caller-supplied row identifier echoed in row errors, at most 128
  // bytes. Correlation only in v0; it does not deduplicate rows (batch dedup
  // uses request_id).
  string insert_id = 1;
  // The row values keyed by column name. Required.
  google.protobuf.Struct json = 2;
}

// ArrowRecordBatch carries rows as one Arrow IPC stream whose schema must
// match the declared table schema exactly.
message ArrowRecordBatch {
  // A complete Arrow IPC stream (schema message plus record batches), 1
  // through 16777216 bytes.
  bytes serialized_record_batch = 1;
}

// AppendRowsRequest appends one batch of rows to a table. Exactly one of
// rows or arrow_rows must be populated.
message AppendRowsRequest {
  // Target table resource name, "tables/{table}", matching
  // "^tables/[a-z][a-z0-9_]{0,62}$".
  string table = 1;
  // JSON rows, at most 50000 per batch, validated and coerced to the declared
  // schema before acknowledgement.
  repeated Row rows = 2;
  // Arrow IPC alternative to rows for typed, high-throughput appends.
  ArrowRecordBatch arrow_rows = 3;
  // Per-batch idempotency identifier (AIP-155), at most 512 bytes. REST
  // callers may send the Stripe-style Idempotency-Key header instead; it is
  // copied here. Replaying an identical batch is absorbed without
  // duplication; reusing the identifier with different content fails with
  // reason IDEMPOTENCY_MISMATCH.
  string request_id = 4;
  // When true, invalid JSON rows are reported in row_errors and the valid
  // remainder is still committed; when false (default), any invalid row
  // rejects the whole batch.
  bool skip_invalid_rows = 5;
  // Reserved design room: stream identifiers and offsets for
  // Storage-Write-style appends.
  reserved 20 to 24;
}

// RpcStatus is a wire-compatible subset of google.rpc.Status (same field
// numbers) embedded for per-row and per-query errors. It keeps this package
// free of googleapis message dependencies; RPC-level failures still use full
// AIP-193 google.rpc.Status error envelopes on the transport.
message RpcStatus {
  // Numeric google.rpc.Code value.
  int32 code = 1;
  // Developer-facing error message.
  string message = 2;
  // Room for google.rpc.Status.details compatibility.
  reserved 3;
}

// RowError reports one rejected row, BigQuery insertErrors-style.
message RowError {
  // Zero-based index of the row in the request batch.
  int64 index = 1;
  // Why the row was rejected.
  RpcStatus error = 2;
}

// AppendRowsResponse acknowledges a batch. Acknowledged rows are durable and
// immediately queryable.
message AppendRowsResponse {
  // Rows durably accepted by this request (or by the replayed original).
  int64 accepted_rows = 1;
  // Per-row rejections; present only when rows were rejected.
  repeated RowError row_errors = 2;
}

// RunQueryRequest executes one read-only ClickHouse SQL statement over the
// workspace's tables.
message RunQueryRequest {
  // The SQL text, 1 through 262144 bytes. Declared ClickHouse SQL; exactly
  // one SELECT/WITH statement.
  string query = 1;
  // How long to wait synchronously for completion before returning a RUNNING
  // query, 0 through 600000 milliseconds. 0 selects the server default; the
  // server execution cap always bounds total execution regardless of this
  // wait.
  int64 timeout_ms = 2;
  // When true, validate the statement and return the result schema without
  // executing it (ClickHouse EXPLAIN-backed).
  bool dry_run = 3;
  // Maximum rows in the inline first page, 0 through 100000; 0 selects the
  // server default.
  int32 page_size = 4;
  // Reserved design room: request_id, query parameters, and byte budgets.
  reserved 6 to 10;
}

// RunQueryResponse is the sync-first query answer: inline rows on completion
// within the wait, otherwise a RUNNING query to poll via GetQueryResults.
message RunQueryResponse {
  // Query resource name, "queries/{query}". Always present so slow queries
  // and later pages can be fetched.
  string name = 1;
  // One of RUNNING, SUCCEEDED, or FAILED.
  string state = 2;
  // Result schema; present once known (dry runs included).
  TableSchema schema = 3;
  // Inline result rows keyed by column name; present when state is SUCCEEDED.
  repeated google.protobuf.Struct rows = 4;
  // Continuation token for GetQueryResults; empty when the results are
  // complete.
  string next_page_token = 5;
  // Total rows in the full result set; present when state is SUCCEEDED.
  int64 total_rows = 6;
  // Failure cause; present when state is FAILED.
  RpcStatus error = 7;
  // Reserved design room: Arrow result streams, presigned result links, and
  // execution statistics.
  reserved 20 to 29;
}

// GetQueryResultsRequest polls one query and pages its stored results.
message GetQueryResultsRequest {
  // Query resource name, "queries/{query}", matching
  // "^queries/[0-9a-hjkmnp-tv-z]{26}$".
  string name = 1;
  // Opaque continuation token from a previous response, at most 4096 bytes.
  string page_token = 2;
  // Maximum rows per page, 0 through 100000; 0 selects the server default.
  int32 page_size = 3;
}

// GetQueryResultsResponse mirrors RunQueryResponse for polling and
// pagination.
message GetQueryResultsResponse {
  // Query resource name, "queries/{query}".
  string name = 1;
  // One of RUNNING, SUCCEEDED, or FAILED.
  string state = 2;
  // Result schema; present once known.
  TableSchema schema = 3;
  // Result rows for this page; present when state is SUCCEEDED.
  repeated google.protobuf.Struct rows = 4;
  // Continuation token; empty when the results are complete.
  string next_page_token = 5;
  // Total rows in the full result set; present when state is SUCCEEDED.
  int64 total_rows = 6;
  // Failure cause; present when state is FAILED.
  RpcStatus error = 7;
  // Reserved design room mirroring RunQueryResponse.
  reserved 20 to 29;
}
