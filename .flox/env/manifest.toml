schema-version = "1.12.0"

[install]
nodejs.pkg-path = "nodejs_26"
pnpm.pkg-path = "pnpm"
typescript-language-server.pkg-path = "typescript-language-server"
# Flox supplies the portable bootstrap binary; Go's checksum-verified
# toolchain selector below provides the patched release declared by go.mod.
go.pkg-path = "go"
go.version = "1.26.4"
python.pkg-path = "python314"
uv.pkg-path = "uv"
protobuf.pkg-path = "protobuf"

# Repository and quality tooling lives in Flox as well, so local checks and CI
# use the same binaries instead of inheriting them from the host runner.
gnumake = { pkg-path = "gnumake", pkg-group = "repo-tools" }
bash = { pkg-path = "bash", pkg-group = "repo-tools" }
git = { pkg-path = "git", pkg-group = "repo-tools" }
coreutils = { pkg-path = "coreutils", pkg-group = "repo-tools" }
diffutils = { pkg-path = "diffutils", pkg-group = "repo-tools" }
findutils = { pkg-path = "findutils", pkg-group = "repo-tools" }
gawk = { pkg-path = "gawk", pkg-group = "repo-tools" }
gnused = { pkg-path = "gnused", pkg-group = "repo-tools" }
gnugrep = { pkg-path = "gnugrep", pkg-group = "repo-tools" }
ruff = { pkg-path = "ruff", pkg-group = "repo-tools" }
shellcheck = { pkg-path = "shellcheck", pkg-group = "repo-tools" }
shfmt = { pkg-path = "shfmt", pkg-group = "repo-tools" }
actionlint = { pkg-path = "actionlint", pkg-group = "repo-tools" }
gitleaks = { pkg-path = "gitleaks", pkg-group = "repo-tools" }
# The catalog has no x86_64-darwin build of buf 1.72.0, so the proto
# toolchain resolves only for the systems listed here. The pin stays at
# 1.72.0 because the committed contract-sync protos are this version's
# `buf format` output and the validate gate's `buf format --diff
# --exit-code` only passes when the active formatter reproduces them
# byte-for-byte.
buf = { pkg-path = "buf", version = "1.72.0", pkg-group = "buf", systems = ["aarch64-darwin", "aarch64-linux", "x86_64-linux"] }

[vars]
GOTOOLCHAIN = "go1.26.5+auto"
GOFLAGS = "-mod=readonly"
GOENV = "off"
